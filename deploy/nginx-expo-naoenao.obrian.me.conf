# /etc/nginx/sites-available/expo-naoenao.obrian.me
# Serve o app para o Expo Go pela internet (serviço `expo` do compose).
# O Metro é um servidor de desenvolvimento: aqui só passa o que o Expo Go
# precisa para baixar o app (o manifesto, os bundles e as imagens), só GET e
# HEAD, sem WebSocket. Tudo o mais (depurador, recarregar, abrir arquivo no
# editor etc.) fica de fora.
#
# Troque 3071 pela EXPO_PORT do .env. Depois: ln -s em sites-enabled, nginx -t,
# systemctl reload nginx e certbot --nginx -d expo-naoenao.obrian.me.

server {
    listen 80;
    listen [::]:80;
    server_name expo-naoenao.obrian.me;

    client_max_body_size 1k;

    # Nada de WebSocket (o Metro usaria para recarregar e depurar).
    if ($http_upgrade) {
        return 403;
    }

    # Ferramentas de desenvolvimento do Metro: bloqueadas com nome, para ficar claro.
    location ~ ^/(debugger-ui|json|inspector|message|events|open-stack-frame|open-url|symbolicate|reload|hot|status|logs)(/|$) {
        return 403;
    }

    # Manifesto que o Expo Go pede ao ler o QR (exps://expo-naoenao.obrian.me).
    location = / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3071;
        include /etc/nginx/snippets/naoenao-expo-proxy.conf;
    }

    # O app em JavaScript (launchAsset do manifesto) e os pedaços carregados depois.
    location ~ \.bundle$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3071;
        include /etc/nginx/snippets/naoenao-expo-proxy.conf;
    }

    # Ícones e imagens que o manifesto e o app pedem.
    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3071;
        include /etc/nginx/snippets/naoenao-expo-proxy.conf;
    }

    location ^~ /_expo/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3071;
        include /etc/nginx/snippets/naoenao-expo-proxy.conf;
    }

    location / {
        return 404;
    }
}
