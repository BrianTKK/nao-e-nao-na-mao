# /etc/nginx/snippets/naoenao-expo-proxy.conf
# Cabeçalhos comuns do proxy do Metro (incluído pelo site expo-naoenao.obrian.me).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header Upgrade "";
proxy_set_header X-Forwarded-Proto $scheme;
# O primeiro bundle depois de subir leva ~30 s; o aquecimento costuma evitar a espera.
proxy_read_timeout 180s;
proxy_buffering on;
