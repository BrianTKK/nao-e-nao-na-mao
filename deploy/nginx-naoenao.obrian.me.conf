# /etc/nginx/sites-available/naoenao.obrian.me
# Troque 3070 pela APP_PORT do .env. Depois: ln -s em sites-enabled, nginx -t,
# systemctl reload nginx e certbot --nginx -d naoenao.obrian.me (o Certbot
# acrescenta o bloco 443 e o redirecionamento de HTTP para HTTPS).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name naoenao.obrian.me;

    # A API recusa corpo acima de 10 kB; o Nginx corta antes.
    client_max_body_size 64k;

    # WebSocket do tempo real (Socket.IO): conexão longa.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Foto do cardápio: até 3 MB, cerca de 4 MB em base64 (a API aceita até 4,5 MB só aqui).
    location = /api/manager/menu/files {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # APK do app próprio (Android), fora da pasta do deploy (o deploy.sh não o toca).
    # Versão nova: subir o arquivo em /var/www/naoenao-files, trocar o alias, nginx -t e reload.
    location = /download/mariana.apk {
        alias /var/www/naoenao-files/mariana-1.0.0-e3d83cf.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="mariana.apk"' always;
        add_header Cache-Control 'no-cache' always;
    }

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
